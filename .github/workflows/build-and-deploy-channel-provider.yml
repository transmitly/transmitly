name: Build, Test And Deploy Channel Provider

on: 
  workflow_call:
    inputs:
      channelProviderName:
        required: true
        type: string
      buildConfiguration:
        required: false
        default: Debug
        type: string
      runTests:
        required: false
        default: false
        type: boolean
      solutionFile:
        description: Solution file to build. Defaults to <channelProviderName>.sln.
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: windows-latest
    env:
      solutionFile: ${{ inputs.solutionFile || format('{0}.sln', inputs.channelProviderName) }}
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDKs (multi-TFM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'
      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0
      - name: Build netcore solution
        run: dotnet build ${{ env.solutionFile }} --configuration ${{inputs.buildConfiguration}} -p:AssemblyVersion=${{ env.assemblySemVer }} -p:FileVersion=${{ env.assemblySemFileVer  }} -p:InformationalVersion=${{ env.informationalVersion }}
      - name: Test
        if: ${{ inputs.runTests }}
        run: dotnet test --no-build --no-restore --configuration Debug ${{ env.solutionFile }}
      - name: Package
        run: dotnet pack ${{ env.solutionFile }} --no-build --include-source /p:Version=${{ env.majorMinorPatch }}-${{env.buildMetaData}}.${{ env.shortSha }} --configuration ${{inputs.buildConfiguration}} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - name: Publish Nuget
        run: dotnet nuget push src\${{inputs.channelProviderName}}\bin\${{inputs.buildConfiguration}}\${{inputs.channelProviderName}}*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}